<app-title (create)="create()" [createAction]="true" subtitle="Gestión" title="Procedimientos Legales"></app-title>

<div class="filters-card">
    <app-filter-input (enter)="search()" [(value)]="criteria.title" title="Titulo"></app-filter-input>
    <app-filter-input (enter)="search()" [(value)]="criteria.task" title="Tarea"></app-filter-input>
</div>

<app-crud (create)="create()" (read)="read($event)" (searchAll)="search()"
          (update)="update($event)" [updateAction]="updateVisibility"
          (delete)="delete($event)" [deleteAction]="deleteVisibility" [secureDelete]="true"
          [columns]="columns" [data]="templates" [item]="template" [readAction]="true" >
</app-crud>
